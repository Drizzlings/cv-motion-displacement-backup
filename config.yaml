input_dir: dataset
output_dir: output

calibration:
  reference_width_mm: 50.0
  reference_height_mm: 50.0
  points_file: calibration_points.yaml
  # The frame shown when manually marking calibration points.
  mark_frame_index: 0

optical_flow:
  target_rois_file: target_rois.yaml
  init_frame_index: 0
  max_corners: 80
  quality_level: 0.01
  min_distance: 5
  block_size: 7
  grid_size: 5
  min_tracks: 6
  win_size: [21, 21]
  max_level: 3
  max_forward_backward_error: 2.0
  max_center_jump_px: 80
  ransac_reproj_threshold: 4.0
  min_inliers: 4
  min_quad_area_scale: 0.25
  max_quad_area_scale: 4.0
  template_reacquire: true
  template_match_threshold: 0.55
  template_check_interval: 3
  smooth_window: 5

quality:
  min_valid_ratio: 0.55
  max_world_step_mm: 200.0
  max_abs_world_coord_mm: 5000.0
